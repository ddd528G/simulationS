<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простий Симулятор Архівування</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .section { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea { height: 80px; resize: none; }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover { background-color: #219150; }
        .result-box {
            background: #eef2f5;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-line;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📦 Простий Симулятор Архіватора</h2>

    <!-- Створення файлу -->
    <div class="section">
        <label for="filename">Назва файлу:</label>
        <input type="text" id="filename" value="document.txt">
    </div>

    <div class="section">
        <label for="filetext">Вміст файлу (для кращого стиснення повторюйте букви):</label>
        <textarea id="filetext">AAAAAABBBCCCCCDDDD</textarea>
    </div>

    <button class="btn" onclick="compressFile()">Створити архів і стиснути</button>

    <!-- Звіт про архів -->
    <div class="section" style="margin-top: 25px;">
        <label>Результат архівування:</label>
        <div class="result-box" id="resultOutput">Натисніть кнопку, щоб побачити результат...</div>
    </div>
</div>

<script>
function compressFile() {
    let name = document.getElementById('filename').value.trim() || 'file.txt';
    let text = document.getElementById('filetext').value;

    if (!text) {
        alert('Введіть текст для файлу!');
        return;
    }

    // Простий алгоритм RLE для стиснення
    let compressed = '';
    let count = 1;
    for (let i = 0; i < text.length; i++) {
        if (text[i] === text[i + 1]) {
            count++;
        } else {
            compressed += count + text[i];
            count = 1;
        }
    }

    let originalSize = text.length;
    let compressedSize = compressed.length;
    let savings = (((originalSize - compressedSize) / originalSize) * 100).toFixed(1);

    // Звіт про результати
    let output = `📄 Файл: ${name}\n`;
    output += `------------------------------------\n`;
    output += `Оригінальний вміст: ${text}\n`;
    output += `Розмір до стиснення: ${originalSize} символів\n\n`;
    output += `📦 Архівний вміст (RLE): ${compressed}\n`;
    output += `Розмір після стиснення: ${compressedSize} символів\n`;
    output += `------------------------------------\n`;
    output += `📊 Економія місця: ${savings}%`;

    document.getElementById('resultOutput').innerText = output;
}
</script>

</body>
</html>
