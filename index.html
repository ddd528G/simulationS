<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проста симуляція архівування</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #1e293b; margin-bottom: 20px; }
        p { color: #64748b; font-size: 14px; }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 12px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        
        .result {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📦 Симулятор архівування</h2>
    <p>Оберіть файл, щоб побачити, як працює стиснення:</p>

    <div class="btn-group">
        <button onclick="compress('doc')">📄 Текстовий документ (.txt)</button>
        <button onclick="compress('photo')">🖼️ Фотографія (.bmp -> .jpg)</button>
        <button onclick="compress('music')">🎵 Аудіозапис (.wav -> .mp3)</button>
    </div>

    <div id="output" class="result">
        Оберіть файл вище, щоб проаналізувати результат...
    </div>
</div>

<script>
function compress(type) {
    let out = document.getElementById('output');

    if (type === 'doc') {
        out.innerHTML = `
            <b>Тип:</b> Текстовий документ<br>
            <b>Тип стиснення:</b> Без втрат (Lossless)<br>
            <b>Початковий розмір:</b> 100 КБ<br>
            <b>Після архівування:</b> 30 КБ<br>
            <b>Економія місця:</b> <span style="color: green; font-weight: bold;">70%</span><br>
            <i>Текст залишився на 100% точним!</i>
        `;
    } else if (type === 'photo') {
        out.innerHTML = `
            <b>Тип:</b> Фотографія<br>
            <b>Тип стиснення:</b> З втратами (Lossy)<br>
            <b>Початковий розмір:</b> 5000 КБ (5 МБ)<br>
            <b>Після стиснення:</b> 800 КБ<br>
            <b>Економія місця:</b> <span style="color: green; font-weight: bold;">84%</span><br>
            <i>Видалено деталі, непомітні для ока.</i>
        `;
    } else if (type === 'music') {
        out.innerHTML = `
            <b>Тип:</b> Аудіозапис<br>
            <b>Тип стиснення:</b> З втратами (Lossy)<br>
            <b>Початковий розмір:</b> 40000 КБ (40 МБ)<br>
            <b>Після стиснення:</b> 4000 КБ (4 МБ)<br>
            <b>Економія місця:</b> <span style="color: green; font-weight: bold;">90%</span><br>
            <i>Видалено надвисокі частоти, які людина не чує.</i>
        `;
    }
}
</script>

</body>
</html>
